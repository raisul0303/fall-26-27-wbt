<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form method="post">
        <h2>Donor Information</h2>
        <table>
            <tr>
                <td><label for="fname">First Name*</label></td>
                <td><input type="text" id="fname" name="fname required"></td>
            </tr>

            <tr>
                <td><label for="lname">Last Name*</label></td>
                <td><input type="text" id="lname" name="lname required"></td>
            </tr>

            <tr>
                <td><label for="company">Company</label></td>
                <td><input type="text" id="company" name="company required"></td>
            </tr>

            <tr>
                <td><label for="address1">Address 1*</label></td>
                <td><input type="text" id="address1" name="address1 required"></td>
            </tr>

            <tr>
                <td><label for="address2">Address 2</label></td>
                <td><input type="text" id="address2" name="address2 required"></td>
            </tr>

            <tr>
                <td><label for="city">City</label></td>
                <td><input type="text" id="city" name="city required"></td>
            </tr>

            <tr>
                <td><label for="state">State</label></td>
                <td>
                    <select id="state" name="State">
                        <option value="">Select a state</option>
                        <option>Dhaka</option>
                        <option>Chittagong</option>
                        <option>Rajshahi</option>
                        <option>Khulna</option>
                        <option>Sylhet</option>
                        <option>Rangpur</option>
                        <option>Barishal</option>
                        <option>Mymenshing</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td><label for="zipcode">Zip code*</label></td>
                <td><input type="number" id="zipcode" name="zipcode required"></td>
            </tr>


            <tr>
                <td><label for="country">Country</label></td>
                <td>
                    <select id="country" name="Country">
                        <option value="">Select a country</option>
                        <option>Bangladesh</option>
                        <option>USA</option>
                        <option>UK</option>
                        <option>Australia</option>
                        <option>Argentina</option>
                        <option>Spain</option>
                        <option>Canada</option>
                        <option>Nepal</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td><label for="phone">Phone</label></td>
                <td><input type="tel" id="phone" name="phone required"></td>
            </tr>

            <tr>
                <td><label for="fax">Fax</label></td>
                <td><input type="tel" id="fax" name="fax required"></td>
            </tr>

            <tr>
                <td><label for="email">Email*</label></td>
                <td><input type="text" id="email" name="email required"></td>
            </tr>

            <tr>
                <td>
                    <label>Donation Amount*</label><br>(Check a button or type in your amount)
                </td>
                <td>
                    <input type="radio" name="amount" value="none">None
                    <input type="radio" name="amount" value="50">$50
                    <input type="radio" name="amount" value="75">$75
                    <input type="radio" name="amount" value="100">$100
                    <input type="radio" name="amount" value="250">$250
                    <input type="radio" name="amount" value="other">Other
                </td>
            </tr>

            <tr>
                <td></td>
                <td><label for="email">Other Amount $</label></td>
                <td><input type="number" id="other" name="other"></td>
            </tr>

            <tr>
                <td>
                    <label>Recurring Donation</label><br>(Check if yes)
                </td>
                <td>
                    <input type="checkbox" value="recurring">I am interested in giving up on a regular basis.
                </td>
            </tr>

            <tr>
                <td></td>
                <td><label for="monthly">Monthly Credit Card $</label></td>
                <td>
                    <input type="number" id="monthly" name="monthly">
                    <label for="monthly"> For </label>
                    <input type="number" id="months" name="months"> Months

                </td>
            </tr>


        </table>
        <h2>Honorarium and Memorial Donation Information</h2>
        <table>
            <tr>
                <td><label>I would like to make this donation:</label></td>
                <td>
                    <input type="radio" name="honor" value="honor"> To Honor<br>
                    <input type="radio" name="honor" value="memory"> In Memory of
                </td>
            </tr>

            <tr>
                <td><label for="name">Name</label></td>
                <td><input type="text" id="name" name="name required"></td>
            </tr>

            <tr>
                <td><label for="acknowledge">Acknowledge Donation to</label></td>
                <td><input type="text" id="acknowledge" name="acknowledge required"></td>
            </tr>

            <tr>
                <td><label for="address">Address</label></td>
                <td><input type="text" id="address" name="address required"></td>
            </tr>

            <tr>
                <td><label for="city">City</label></td>
                <td><input type="text" id="city" name="city required"></td>
            </tr>

            <tr>
                <td><label for="state">State</label></td>
                <td>
                    <select id="state" name="State">
                        <option value="">Select a state</option>
                        <option>Dhaka</option>
                        <option>Chittagong</option>
                        <option>Rajshahi</option>
                        <option>Khulna</option>
                        <option>Sylhet</option>
                        <option>Rangpur</option>
                        <option>Barishal</option>
                        <option>Mymenshing</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td><label for="zip">Zip</label></td>
                <td><input type="number" id="zip" name="zip required"></td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="reset" value="Reset">
                </td>
            </tr>

        </table>
    </form>
</body>

</html>
